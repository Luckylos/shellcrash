# ShellCrash / Mihomo / Clash Meta 通用订阅转换后端模板
# 说明：
# - 这是一份供 Mihomo 兼容客户端使用的 YAML 模板，不直接内置节点。
# - 转换后端负责注入订阅节点；本文件本身必须能在没有 ShellCrash 覆盖的客户端上工作。
# - 宿主机可按需覆盖 DNS 监听、地址池与接管设置，但不改变本模板的分流意图。
# - 路由需求：AI 优先美区、Telegram 优先新加坡、中国大陆直连、其余流量经「🐟 漏网之鱼」走代理。
# - 已移除固定出口 listeners（原 17891-17899 / 🎛️ 出口 1-9）。需要固定出口的客户端应改用
#   mixed-port 或另行按需增加，本模板不再提供端口级出口。
# - 地区组采用“自动测速优先，失败后 fallback 到同地区手动选择”的结构。
# - 链式代理：proxy-providers.chainpool 读取 ShellCrash 下载进 home 的订阅产物，
#   复制每个节点并注入节点级 dialer-proxy，形成「🔗 链式前置 → 🔗 链式落地」两跳。
#   模板本身不保存订阅地址。

x-filter-hk: &filter-hk '(?i)(?:香港|hong[ -]?kong|\b(?:hk|hkg)\b|🇭🇰)'
x-filter-jp: &filter-jp '(?i)(?:日本|japan|东京|\b(?:jp|jpn)\b|🇯🇵)'
x-filter-sg: &filter-sg '(?i)(?:新加坡|singapore|\b(?:sg|sgp)\b|🇸🇬)'
x-filter-us: &filter-us '(?i)(?:美国|美东|美西|america|united[ -]?states|\b(?:us|usa|lax|sfo|jfk|sjc)\b|🇺🇸)'
x-filter-known-regions: &filter-known-regions '(?i)(?:香港|hong[ -]?kong|\b(?:hk|hkg)\b|🇭🇰|日本|japan|东京|\b(?:jp|jpn)\b|🇯🇵|新加坡|singapore|\b(?:sg|sgp)\b|🇸🇬|美国|美东|美西|america|united[ -]?states|\b(?:us|usa|lax|sfo|jfk|sjc)\b|🇺🇸)'
x-filter-chain: &filter-chain '🔗'
x-filter-chain-or-known-regions: &filter-chain-or-known-regions '(?i)🔗|(?:香港|hong[ -]?kong|\b(?:hk|hkg)\b|🇭🇰|日本|japan|东京|\b(?:jp|jpn)\b|🇯🇵|新加坡|singapore|\b(?:sg|sgp)\b|🇸🇬|美国|美东|美西|america|united[ -]?states|\b(?:us|usa|lax|sfo|jfk|sjc)\b|🇺🇸)'

x-region-auto: &region-auto
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  include-all: true

x-region-manual: &region-manual
  type: select
  include-all: true

x-region-fallback: &region-fallback
  type: fallback
  url: https://www.gstatic.com/generate_204
  interval: 300

x-rule-set-domain: &rule-set-domain
  type: http
  behavior: domain
  format: mrs
  interval: 86400
  # 手机等无 ShellCrash 覆盖的客户端可能无法直连 GitHub。
  # 通过已注入的代理组下载规则集，避免规则集为空导致全量误走 MATCH。
  proxy: 🚀 节点选择

x-rule-set-ipcidr: &rule-set-ipcidr
  type: http
  behavior: ipcidr
  format: mrs
  interval: 86400
  proxy: 🚀 节点选择

mode: rule
mixed-port: 7890
allow-lan: true
ipv6: true
log-level: info
external-controller: "127.0.0.1:9090"

profile:
  store-selected: true
  store-fake-ip: true

# 通用客户端使用 fake-ip；国内域名使用阿里 DoH，其余域名使用境外 DoH。
# 宿主可覆盖监听、地址池与接管设置，但不应改变本模板的分流意图。
dns:
  enable: true
  listen: 127.0.0.1:1053
  use-hosts: true
  use-system-hosts: true

  # 通用 IPv4 基线；IPv6 需与客户端接管能力配套启用。
  ipv6: false

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist

  # 本地名称的真实解析依赖 hosts 或客户端的局域网 DNS。
  # 国内普通域名同样使用 fake-ip，不在此排除整个 cn 规则集。
  fake-ip-filter:
    - "*"
    - "+.lan"
    - "+.local"
    - "+.localdomain"
    - "+.localhost"
    - "+.home.arpa"
    - "+.internal"
    - "+.router"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "ntp.*.com"
    - "+.pool.ntp.org"

  respect-rules: true

  # 引导解析使用 IP 字面量 DoH，避免依赖明文 bootstrap。
  default-nameserver:
    - "https://223.5.5.5/dns-query"

  # 节点域名解析独立于代理启动链路。
  proxy-server-nameserver:
    - "https://223.5.5.5/dns-query"

  # DIRECT 连接使用阿里 DoH 获取真实地址。
  direct-nameserver:
    - "https://223.5.5.5/dns-query"
  direct-nameserver-follow-policy: false

  # 其他域名使用境外 DoH；DNS 上游连接由路由规则决定出口。
  nameserver:
    - "https://cloudflare-dns.com/dns-query"
    - "https://dns.google/dns-query"

  # 复用模板已有的国内域名规则集，不新增 GeoSite 数据依赖。
  nameserver-policy:
    "rule-set:cn":
      - "https://223.5.5.5/dns-query"

proxy-providers:
  # 链式落地池：直接读取 ShellCrash 下载进 home 的那份订阅产物
  # （-d /etc/ShellCrash 下的 ./yamls/config.yaml，即 MiSub 输出，含 proxies 段）。
  #
  # 为什么不用 url: "{{ request.url }}"：
  # MiSub 的 clash-yaml-profile 模板模式（响应头 x-misub-template-mode: clash-yaml-profile）
  # 只做 YAML 解析 → 合并 proxies → dump，不渲染任何模板变量；{{ }} 会原样留在产物里，
  # provider 拉取必然失败、链式落地为空。SubConverter 才支持 {{ request.url }}。
  #
  # path 必须是相对路径：基准是 mihomo 的 -d 目录，绝对路径会被 SAFE_PATHS 拒绝。
  # 该路径是 ShellCrash 专有；其他客户端上 provider 加载为空，链式落地退化为 REJECT，
  # 其余分流功能不受影响。
  # health-check 必须关闭：开启会让每个链式节点都经前置节点额外测速一遍。
  chainpool:
    type: file
    path: ./yamls/config.yaml
    health-check:
      enable: false
      url: https://www.gstatic.com/generate_204
      interval: 300
    override:
      additional-prefix: "🔗 "
      dialer-proxy: 🔗 链式前置

proxy-groups:
  # ── 一、入口策略组：规则命中后的落点，日常主要在这里切换 ──

  - name: 🚀 节点选择
    type: select
    proxies:
      - 🇭🇰 香港
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 其余地区
      - 🔗 链式落地

  - name: 🤖 AI 服务
    type: select
    proxies:
      - 🇺🇸 美国
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 其余地区
      - 🔗 链式落地
      - 🚀 节点选择

  - name: ⓖ Gemini
    type: select
    proxies:
      - 🇺🇸 美国
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 其余地区
      - 🔗 链式落地
      - 🚀 节点选择

  - name: 📲 Telegram
    type: select
    proxies:
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 🇯🇵 日本
      - 🇺🇸 美国
      - 其余地区
      - 🔗 链式落地
      - 🚀 节点选择

  # 国内流量：默认直连，保留代理作为手动备选（应对个别国内域名需要走代理的场景）。
  # DIRECT 必须保持第一候选；规则继续指向本组，不改为写死的 DIRECT。
  - name: 🎯 国内流量
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - 🇭🇰 香港
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 其余地区
      - 🔗 链式落地

  # 漏网之鱼：所有未被上面规则命中的流量。默认跟随 🚀 节点选择，
  # 保留 DIRECT 作为末位手动开关，便于临时排障，但不作为默认出口。
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - 🇭🇰 香港
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 其余地区
      - 🔗 链式落地
      - DIRECT

  # ── 二、链式代理：出口节点的 dialer-proxy 指向第一跳 ──
  # - 🔗 链式前置：第一跳。只吸收转换后端注入的顶层节点（include-all-proxies），
  #   不能用 include-all，否则会把 chainpool 复制出的「🔗 」节点吸回来形成环路。
  # - 🔗 链式落地：第二跳。chainpool 复制本次订阅节点并注入 dialer-proxy。
  #   本组不引用 🚀 节点选择 / 🐟 漏网之鱼 / 链式前置，避免成环。

  - name: 🔗 链式前置
    type: select
    include-all-proxies: true

  - name: 🔗 链式落地
    type: select
    use:
      - chainpool
    empty-fallback: REJECT

  # ── 三、地区主组：入口策略组的实际落点。先用「自动」，失败回退「手动」 ──

  - name: 🇭🇰 香港
    <<: *region-fallback
    proxies:
      - 🇭🇰 香港-自动
      - 🇭🇰 香港-手动

  - name: 🇯🇵 日本
    <<: *region-fallback
    proxies:
      - 🇯🇵 日本-自动
      - 🇯🇵 日本-手动

  - name: 🇸🇬 新加坡
    <<: *region-fallback
    proxies:
      - 🇸🇬 新加坡-自动
      - 🇸🇬 新加坡-手动

  - name: 🇺🇸 美国
    <<: *region-fallback
    proxies:
      - 🇺🇸 美国-自动
      - 🇺🇸 美国-手动

  - name: 其余地区
    <<: *region-fallback
    proxies:
      - 其余地区-自动
      - 其余地区-手动

  # ── 四、地区内部实现组：按地区成对排列，一般不需要直接操作 ──
  #   -手动：同地区内手动指定具体节点（select，不测速），作为自动组失败时的回退
  #   -自动：同地区内自动择优（url-test），由地区主组优先使用

  - name: 🇭🇰 香港-手动
    <<: *region-manual
    filter: *filter-hk
    exclude-filter: *filter-chain
  - name: 🇭🇰 香港-自动
    <<: *region-auto
    filter: *filter-hk
    exclude-filter: *filter-chain

  - name: 🇯🇵 日本-手动
    <<: *region-manual
    filter: *filter-jp
    exclude-filter: *filter-chain
  - name: 🇯🇵 日本-自动
    <<: *region-auto
    filter: *filter-jp
    exclude-filter: *filter-chain

  - name: 🇸🇬 新加坡-手动
    <<: *region-manual
    filter: *filter-sg
    exclude-filter: *filter-chain
  - name: 🇸🇬 新加坡-自动
    <<: *region-auto
    filter: *filter-sg
    exclude-filter: *filter-chain

  - name: 🇺🇸 美国-手动
    <<: *region-manual
    filter: *filter-us
    exclude-filter: *filter-chain
  - name: 🇺🇸 美国-自动
    <<: *region-auto
    filter: *filter-us
    exclude-filter: *filter-chain

  - name: 其余地区-手动
    <<: *region-manual
    exclude-filter: *filter-chain-or-known-regions

  # 自动组：由地区主组优先使用，失败后回退到同地区手动组，不参与跨地区回退
  - name: 其余地区-自动
    <<: *region-auto
    exclude-filter: *filter-chain-or-known-regions

rule-providers:
  # Gemini 单独使用固定策略组，避免与其他 AI 共用出口
  Gemini:
    <<: *rule-set-domain
    url: https://github.com/666OS/rules/raw/release/mihomo/domain/Gemini.mrs
  AI:
    <<: *rule-set-domain
    url: https://github.com/666OS/rules/raw/release/mihomo/domain/AI.mrs
  Telegram:
    <<: *rule-set-domain
    url: https://github.com/666OS/rules/raw/release/mihomo/domain/Telegram.mrs
  TelegramIP:
    <<: *rule-set-ipcidr
    url: https://github.com/666OS/rules/raw/release/mihomo/ip/Telegram.mrs
  # 名称必须是 cn：dns.nameserver-policy 里以 rule-set:cn 引用它
  cn:
    <<: *rule-set-domain
    url: https://github.com/666OS/rules/raw/release/mihomo/domain/China.mrs
  cnip:
    <<: *rule-set-ipcidr
    url: https://github.com/666OS/rules/raw/release/mihomo/ip/China.mrs

  # 本地/私网域名与地址
  Private:
    <<: *rule-set-domain
    url: https://github.com/666OS/rules/raw/release/mihomo/domain/Private.mrs
  PrivateIP:
    <<: *rule-set-ipcidr
    url: https://github.com/666OS/rules/raw/release/mihomo/ip/Private.mrs

  # 明确的直连例外
  Direct:
    <<: *rule-set-domain
    url: https://github.com/666OS/rules/raw/release/mihomo/domain/Direct.mrs

  # 已知国外/代理服务；不是所有国外域名的全集
  Proxy:
    <<: *rule-set-domain
    url: https://github.com/666OS/rules/raw/release/mihomo/domain/Proxy.mrs
  ProxyIP:
    <<: *rule-set-ipcidr
    url: https://github.com/666OS/rules/raw/release/mihomo/ip/Proxy.mrs

rules:
  #cloudflare隧道
  #- IP-CIDR,198.41.192.0/24,DIRECT,no-resolve
  #- IP-CIDR,198.41.200.0/24,DIRECT,no-resolve
  #- IP-CIDR,198.41.218.0/24,DIRECT,no-resolve
  #- IP-CIDR,198.41.219.0/24,DIRECT,no-resolve
  #- IP-CIDR6,2606:4700:a0::/124,DIRECT,no-resolve
  #- IP-CIDR6,2606:4700:a8::/124,DIRECT,no-resolve
  #- IP-CIDR6,2606:4700:a1::/124,DIRECT,no-resolve
  #- IP-CIDR6,2606:4700:a9::/124,DIRECT,no-resolve
  #- DOMAIN-SUFFIX,argotunnel.com,DIRECT

  # 本地域名显式直连；fake-ip 过滤只决定 DNS 返回形式，不等于路由直连。
  - DOMAIN,localhost,DIRECT
  - DOMAIN,router,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,router,DIRECT
  - DOMAIN-SUFFIX,internal,DIRECT

  # 本地/私网直连：保护宿主机、Docker、CGNAT 与 IPv6 本地链路
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve

  # 同源规则集补充本地/私网域名与地址
  - RULE-SET,Private,DIRECT
  - RULE-SET,PrivateIP,DIRECT,no-resolve

  # Gemini 单独使用专用策略组；必须先于通用 AI 规则命中
  - RULE-SET,Gemini,ⓖ Gemini

  # AI 走独立策略组（放在国内规则之前，避免国内规则集误收 AI 域名）
  - RULE-SET,AI,🤖 AI 服务

  # Telegram 优先新加坡
  - RULE-SET,Telegram,📲 Telegram
  - RULE-SET,TelegramIP,📲 Telegram,no-resolve

  # 明确的直连例外优先于通用国外规则
  - RULE-SET,Direct,🎯 国内流量

  # 已知国外/代理服务优先于国内规则，避免规则集交集造成误直连
  - RULE-SET,Proxy,🐟 漏网之鱼

  # 中国大陆直连：域名走 cn 规则集，裸 IP 走 cnip 规则集。
  - RULE-SET,cn,🎯 国内流量

  # 已知国外服务的裸 IP 必须先于国内 IP 规则命中。
  - RULE-SET,ProxyIP,🐟 漏网之鱼,no-resolve

  # cnip 带 no-resolve，避免对裸 IP 规则强制触发 DNS 解析。
  # 不使用 GEOIP,CN：ChinaIP 规则集已覆盖，且可避免依赖 geoip 数据库下载。
  - RULE-SET,cnip,🎯 国内流量,no-resolve

  # 漏网之鱼：其余全部流量统一走代理
  - MATCH,🐟 漏网之鱼
