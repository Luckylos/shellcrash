# ShellCrash 当前实际需求的订阅转换后端模板
# 说明：
# - 这是一份供 Mihomo / 订阅转换后端使用的 YAML 模板，不直接内置节点。
# - 转换后端负责注入订阅节点；本文件只表达当前 ShellCrash 的路由需求、DNS 行为与策略组结构。
# - 路由需求：AI 优先美区、Telegram 优先新加坡、中国大陆直连、其余流量经「🐟 漏网之鱼」走代理。
# - 已移除固定出口 listeners（原 17891-17899 / 🎛️ 出口 1-9）。需要固定出口的客户端应改用
#   mixed-port 或另行按需增加，本模板不再提供端口级出口。
# - 地区组采用“手动指定节点优先，失效后自动 fallback 到同地区可连通节点”的结构。

x-filter-hk: &filter-hk '(?i)(?:香港|hong[ -]?kong|\b(?:hk|hkg)\b|🇭🇰)'
x-filter-jp: &filter-jp '(?i)(?:日本|japan|东京|\b(?:jp|jpn)\b|🇯🇵)'
x-filter-sg: &filter-sg '(?i)(?:新加坡|singapore|\b(?:sg|sgp)\b|🇸🇬)'
x-filter-us: &filter-us '(?i)(?:美国|美东|美西|america|united[ -]?states|\b(?:us|usa|lax|sfo|jfk|sjc)\b|🇺🇸)'
x-filter-known-regions: &filter-known-regions '(?i)(?:香港|hong[ -]?kong|\b(?:hk|hkg)\b|🇭🇰|日本|japan|东京|\b(?:jp|jpn)\b|🇯🇵|新加坡|singapore|\b(?:sg|sgp)\b|🇸🇬|美国|美东|美西|america|united[ -]?states|\b(?:us|usa|lax|sfo|jfk|sjc)\b|🇺🇸)'

x-region-auto: &region-auto
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  include-all: true

x-region-manual: &region-manual
  type: select
  include-all: true

x-region-fallback: &region-fallback
  type: fallback
  url: http://www.gstatic.com/generate_204
  interval: 300

x-rule-set-domain: &rule-set-domain
  type: http
  behavior: domain
  format: mrs
  interval: 86400

x-rule-set-ipcidr: &rule-set-ipcidr
  type: http
  behavior: ipcidr
  format: mrs
  interval: 86400

mode: rule
mixed-port: 7890
allow-lan: true
ipv6: false
log-level: info
external-controller: ":9090"

profile:
  store-selected: true

# 保留当前 ShellCrash 的 DNS 需求：
# - fake-ip
# - 监听 0.0.0.0:1053 供局域网/宿主机使用
# - 仅对局域网/本地域名做 fake-ip 排除
# - 上游继续使用阿里/腾讯 DoH
# - 国内域名走国内 DoH（依赖下方 rule-providers 中的 cn，名称必须保持为 cn）
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 1.1.1.1
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "rule-set:cn":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"

proxy-groups:
  # ── 一、入口策略组：规则命中后的落点，日常主要在这里切换 ──

  - name: 🚀 节点选择
    type: select
    proxies:
      - 🇭🇰 香港
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 其余地区

  - name: 🤖 AI 服务
    type: select
    proxies:
      - 🇺🇸 美国
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 其余地区
      - 🚀 节点选择

  - name: 📲 Telegram
    type: select
    proxies:
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 🇯🇵 日本
      - 🇺🇸 美国
      - 其余地区
      - 🚀 节点选择

  # 国内流量：默认直连，保留代理作为手动备选（应对个别国内域名需要走代理的场景）。
  # DIRECT 必须保持第一候选；规则继续指向本组，不改为写死的 DIRECT。
  - name: 🎯 国内流量
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - 🇭🇰 香港
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 其余地区

  # 漏网之鱼：所有未被上面规则命中的流量。默认跟随 🚀 节点选择，
  # 保留 DIRECT 作为末位手动开关，便于临时排障，但不作为默认出口。
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - 🇭🇰 香港
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 其余地区
      - DIRECT

  # ── 二、地区主组：入口策略组的实际落点。先用「手动」，失效自动回退「自动」 ──

  - name: 🇭🇰 香港
    <<: *region-fallback
    proxies:
      - 🇭🇰 香港-手动
      - 🇭🇰 香港-自动

  - name: 🇯🇵 日本
    <<: *region-fallback
    proxies:
      - 🇯🇵 日本-手动
      - 🇯🇵 日本-自动

  - name: 🇸🇬 新加坡
    <<: *region-fallback
    proxies:
      - 🇸🇬 新加坡-手动
      - 🇸🇬 新加坡-自动

  - name: 🇺🇸 美国
    <<: *region-fallback
    proxies:
      - 🇺🇸 美国-手动
      - 🇺🇸 美国-自动

  - name: 其余地区
    <<: *region-fallback
    proxies:
      - 其余地区-手动
      - 其余地区-自动

  # ── 三、地区内部实现组：按地区成对排列，一般不需要直接操作 ──
  #   -手动：同地区内手动指定具体节点（select，不测速）
  #   -自动：同地区内自动择优（url-test），仅作同地区兜底

  - name: 🇭🇰 香港-手动
    <<: *region-manual
    filter: *filter-hk
  - name: 🇭🇰 香港-自动
    <<: *region-auto
    filter: *filter-hk

  - name: 🇯🇵 日本-手动
    <<: *region-manual
    filter: *filter-jp
  - name: 🇯🇵 日本-自动
    <<: *region-auto
    filter: *filter-jp

  - name: 🇸🇬 新加坡-手动
    <<: *region-manual
    filter: *filter-sg
  - name: 🇸🇬 新加坡-自动
    <<: *region-auto
    filter: *filter-sg

  - name: 🇺🇸 美国-手动
    <<: *region-manual
    filter: *filter-us
  - name: 🇺🇸 美国-自动
    <<: *region-auto
    filter: *filter-us

  - name: 其余地区-手动
    <<: *region-manual
    exclude-filter: *filter-known-regions

  # 自动组：仅作为同地区兜底，不参与跨地区回退
  - name: 其余地区-自动
    <<: *region-auto
    exclude-filter: *filter-known-regions

rule-providers:
  AI:
    <<: *rule-set-domain
    url: https://github.com/666OS/rules/raw/release/mihomo/domain/AI.mrs
  Telegram:
    <<: *rule-set-domain
    url: https://github.com/666OS/rules/raw/release/mihomo/domain/Telegram.mrs
  TelegramIP:
    <<: *rule-set-ipcidr
    url: https://github.com/666OS/rules/raw/release/mihomo/ip/Telegram.mrs
  # 名称必须是 cn：dns.nameserver-policy 里以 rule-set:cn 引用它
  cn:
    <<: *rule-set-domain
    url: https://github.com/666OS/rules/raw/release/mihomo/domain/China.mrs
  cnip:
    <<: *rule-set-ipcidr
    url: https://github.com/666OS/rules/raw/release/mihomo/ip/China.mrs

rules:
  # 本地域名显式直连；fake-ip-filter 只控制 DNS 返回形式，不等于路由直连。
  - DOMAIN,localhost,DIRECT
  - DOMAIN,router,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,router,DIRECT
  - DOMAIN-SUFFIX,internal,DIRECT

  # 本地/私网直连：保护宿主机、Docker、CGNAT 与 IPv6 本地链路
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve

  # 显式补充 AI 域名，避免外部 AI 规则集未覆盖时走错组
  - DOMAIN-SUFFIX,nvidia.com,🤖 AI 服务

  # AI 走独立策略组（放在国内规则之前，避免国内规则集误收 AI 域名）
  - RULE-SET,AI,🤖 AI 服务

  # Telegram 优先新加坡
  - RULE-SET,Telegram,📲 Telegram
  - RULE-SET,TelegramIP,📲 Telegram,no-resolve

  # 中国大陆直连：域名走 cn 规则集，裸 IP 走 cnip 规则集。
  # cnip 带 no-resolve，避免在 fake-ip 模式下为 IP 规则强制触发 DNS 解析。
  # 不使用 GEOIP,CN：ChinaIP 规则集已覆盖，且可避免依赖 geoip 数据库下载。
  - RULE-SET,cn,🎯 国内流量
  - RULE-SET,cnip,🎯 国内流量,no-resolve

  # 漏网之鱼：其余全部流量统一走代理
  - MATCH,🐟 漏网之鱼
